<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c1d95">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Electron Lab">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='8' fill='%23f59e0b'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='11' fill='none' stroke='%2306b6d4' stroke-width='4'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='11' fill='none' stroke='%23db2777' stroke-width='4' transform='rotate(60 32 32)'/%3E%3C/svg%3E">
<title>Electron Configuration Lab</title>
<style>
:root{
  color-scheme:light;
  --ink:#1b1b3a; --muted:#5b5b7a;
  --s:#db2777; --p:#0e7490; --d:#c2410c; --f:#15803d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; min-height:100dvh; color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:#4c1d95;
}
body::before{content:""; position:fixed; top:0; right:0; bottom:0; left:0; z-index:-1;
  background:linear-gradient(135deg,#0f172a 0%,#4c1d95 35%,#be185d 70%,#f59e0b 100%)}
.blobs{position:fixed; top:0; right:0; bottom:0; left:0; overflow:hidden; pointer-events:none; z-index:0}
.blobs i{position:absolute; border-radius:50%; opacity:.55; animation:float 14s ease-in-out infinite alternate; background:radial-gradient(circle, var(--b) 0%, rgba(255,255,255,0) 68%)}
.blobs i:nth-child(1){width:460px;height:460px;--b:#22d3ee;left:-140px;top:8%}
.blobs i:nth-child(2){width:420px;height:420px;--b:#a3e635;right:-120px;top:42%;animation-delay:-5s}
.blobs i:nth-child(3){width:520px;height:520px;--b:#f472b6;left:25%;bottom:-220px;animation-delay:-9s}
@keyframes float{to{transform:translate(40px,-50px) scale(1.15)}}
.wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:0 clamp(.6rem,3vw,1.4rem) 3rem}
@supports (padding:max(0px)){
  .wrap{padding-left:max(clamp(.6rem,3vw,1.4rem), env(safe-area-inset-left)); padding-right:max(clamp(.6rem,3vw,1.4rem), env(safe-area-inset-right)); padding-bottom:max(3rem, calc(env(safe-area-inset-bottom) + 1.5rem))}
  header.top{padding-top:max(1rem, env(safe-area-inset-top))}
}

header.top{display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; justify-content:space-between; padding:1rem 0; color:#fff}
.brand{display:flex; align-items:center; gap:.7rem; font-weight:900; font-size:clamp(1.2rem,3.5vw,1.7rem); cursor:pointer; background:none; border:0; color:#fff; font-family:inherit; padding:0}
.logo{width:40px; height:40px; position:relative; flex:none}
.logo b{position:absolute; left:15px; top:15px; width:10px; height:10px; border-radius:50%; background:#fde047; box-shadow:0 0 12px #fde047}
.logo i{position:absolute; top:2px; bottom:2px; left:0; right:0; border:3px solid #67e8f9; border-radius:50%}
.logo i:nth-child(2){transform:rotate(60deg); border-color:#f9a8d4}
.logo i:nth-child(3){transform:rotate(-60deg); border-color:#bef264}
.tools{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center}
.pill{background:rgba(255,255,255,.95); color:var(--ink); border-radius:999px; padding:.45rem .9rem; font-weight:800; font-size:.95rem; min-height:44px; display:inline-flex; align-items:center}

.btn{
  min-height:48px; padding:.7rem 1.3rem; border:0; border-radius:999px; font:inherit; font-weight:800; cursor:pointer;
  color:#fff; background:#4c1d95; box-shadow:0 5px 0 rgba(0,0,0,.25); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
  touch-action:manipulation;
}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(90deg,#db2777,#f97316)}
.btn.b1{background:linear-gradient(90deg,#0891b2,#6366f1)}
.btn.b2{background:linear-gradient(90deg,#db2777,#f97316)}
.btn.light{background:#fff; color:#4c1d95}
.btn.green{background:linear-gradient(90deg,#16a34a,#0d9488)}
.btn.big{font-size:1.2rem; min-height:58px; padding:.8rem 2rem}
.btn[disabled]{opacity:.5; cursor:not-allowed}
:focus-visible{outline:4px solid #fde047; outline-offset:2px}

.card{background:rgba(255,255,255,.96); border-radius:26px; padding:clamp(1rem,3vw,1.8rem); box-shadow:0 12px 34px rgba(0,0,0,.3); margin-bottom:1.2rem}
.hero{text-align:center}
.hero h1{font-size:clamp(1.9rem,6vw,3rem); margin:.3rem 0; background:linear-gradient(90deg,#0891b2,#7c3aed,#db2777,#ea580c); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent}
.lead{font-size:1.15rem; color:var(--muted); margin:.2rem 0 1rem}
.atom{width:96px; height:96px; margin:0 auto; position:relative}
.atom b{position:absolute; left:38px; top:38px; width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 30% 30%,#fff7ae,#f59e0b); box-shadow:0 0 22px #fbbf24}
.atom i{position:absolute; top:14px; bottom:14px; left:0; right:0; border:4px solid #06b6d4; border-radius:50%; animation:spin 6s linear infinite}
.atom i:nth-child(2){border-color:#ec4899; transform:rotate(60deg); animation-duration:8s}
.atom i:nth-child(3){border-color:#84cc16; transform:rotate(-60deg); animation-duration:10s}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.field{display:block; margin:.6rem auto 1.2rem; max-width:360px; text-align:left; font-weight:800}
.field input{-webkit-appearance:none; appearance:none; width:100%; margin-top:.3rem; min-height:48px; border-radius:14px; border:3px solid #c4b5fd; padding:.5rem .9rem; font:inherit; font-weight:600}
.parts{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin-bottom:1.2rem; text-align:left}
.pcard{border-radius:22px; padding:1.1rem 1.2rem; color:#fff}
.pcard.p1{background:linear-gradient(135deg,#0891b2,#6366f1)}
.pcard.p2{background:linear-gradient(135deg,#db2777,#f97316)}
.pcard h2{margin:.1rem 0 .3rem; font-size:1.25rem}
.pcard p{margin:.2rem 0 .8rem}
.pcard .btn{background:#fff; color:var(--ink)}
.best{margin-top:1rem; color:var(--muted); font-weight:700}

/* sublevel chips */
.sl{display:inline-block; padding:.12rem .6rem; border-radius:10px; font-weight:900; color:#fff; background:var(--c,#475569); margin:.12rem 0}
.sl sup{font-size:.7em; line-height:0; vertical-align:super}
.pill[hidden]{display:none}
.sl.s{--c:var(--s)} .sl.p{--c:var(--p)} .sl.d{--c:var(--d)} .sl.f{--c:var(--f)}
.sl.core{--c:#475569}
.sl.bad{--c:#b91c1c}

table.cap{border-collapse:separate; border-spacing:0 6px; width:100%; font-size:.98rem}
table.cap th{text-align:left; padding:.3rem .6rem; color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.5px}
table.cap td{padding:.5rem .6rem; background:#f5f3ff}
table.cap td:first-child{border-radius:12px 0 0 12px; font-weight:900; color:#fff; background:var(--c)}
table.cap td:last-child{border-radius:0 12px 12px 0}
.twocol{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.2rem; align-items:start}
.aufbau{width:100%; max-width:460px; height:auto; display:block; margin:0 auto}
.notes{margin:.3rem 0 0; padding-left:1.2rem; color:var(--ink)}
.notes li{margin:.35rem 0}

/* quiz */
.qhead{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; justify-content:space-between}
.badge{display:inline-block; color:#fff; font-weight:900; padding:.4rem .9rem; border-radius:999px}
.badge.p1{background:linear-gradient(90deg,#0891b2,#6366f1)}
.badge.p2{background:linear-gradient(90deg,#db2777,#f97316)}
.dots{display:flex; gap:6px; margin:.9rem 0 .3rem}
.dots i{flex:1; height:12px; border-radius:99px; background:#e5e7eb}
.dots i.now{background:#fde047; box-shadow:0 0 0 2px #f59e0b inset}
.dots i.ok{background:#22c55e}
.dots i.part{background:#f59e0b}
.dots i.no{background:#ef4444}
h2.q{font-size:clamp(1.15rem,3.4vw,1.5rem); margin:.8rem 0 .2rem}
.sub{color:var(--muted); margin:.1rem 0 .8rem}
.erow{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; margin:.4rem 0 .8rem}
.erow .sub{flex:1 1 240px; margin:0}
.etile{
  width:118px; min-height:124px; aspect-ratio:1/1.05; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#fde68a,#fbcfe8); box-shadow:0 6px 0 rgba(0,0,0,.2); text-align:center; padding:.3rem; flex:none;
}
.etile.b-s{background:#fbcfe8} .etile.b-p{background:#a5f3fc} .etile.b-d{background:#fed7aa} .etile.b-f{background:#bbf7d0}
.etile .ez{font-weight:900; font-size:1rem}
.etile .es{font-size:2.9rem; font-weight:900; line-height:1}
.etile .en{font-weight:800; font-size:.95rem}
.cfglab{display:block; font-weight:900; margin:.4rem 0 .2rem}
.cfgin{
  -webkit-appearance:none; appearance:none; width:100%; min-height:56px; border-radius:16px; border:3px solid #c4b5fd; padding:.5rem 1rem; font:inherit; font-size:1.25rem; font-weight:800; letter-spacing:.5px; color:var(--ink); background:#fff;
}
.cfgin:focus{border-color:#7c3aed; outline:none; box-shadow:0 0 0 4px #ddd6fe}
.cfgin.good{border-color:#16a34a; background:#dcfce7}
.cfgin.bad{border-color:#dc2626; background:#fee2e2}
.prev{min-height:3.2rem; margin:.5rem 0; padding:.5rem .8rem; border-radius:16px; background:linear-gradient(135deg,#ecfeff,#fdf4ff,#fff7ed); border:3px dashed #c4b5fd; font-size:1.2rem}
.prev .cnt{display:block; font-size:.88rem; font-weight:800; color:var(--muted); margin-top:.3rem}
.prev .cnt.ok{color:#15803d} .prev .cnt.over{color:#b91c1c}
.prev .ph{color:#94a3b8; font-size:.95rem}
.keypad{margin:.6rem 0}
.kp-row{display:flex; flex-wrap:wrap; gap:.4rem; margin:.4rem 0}
.key{min-width:48px; min-height:48px; border-radius:14px; border:0; font:inherit; font-weight:900; font-size:1.05rem; color:#fff; background:var(--c,#4c1d95); cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25); touch-action:manipulation; padding:.2rem .7rem}
.key:active{transform:translateY(2px); box-shadow:none}
.key.dig{background:#fff; color:var(--ink); border:3px solid #c4b5fd; box-shadow:none}
.key.util{background:#64748b}
.key[disabled]{opacity:.45; cursor:not-allowed}
.fld{background:#f5f3ff; border-radius:18px; padding:.8rem 1rem; margin:.7rem 0}
.fld h3{margin:0 0 .5rem; font-size:1.02rem}
.fld h3 small{font-weight:600; color:var(--muted)}
.choice{display:flex; flex-wrap:wrap; gap:.5rem}
.choice button{min-width:52px; min-height:52px; border-radius:14px; border:3px solid var(--c,#7c3aed); background:#fff; color:var(--c,#4c1d95); font:inherit; font-weight:900; font-size:1.2rem; cursor:pointer; touch-action:manipulation}
.choice button[aria-pressed="true"]{background:var(--c,#7c3aed); color:#fff}
.choice button.right{background:#16a34a; border-color:#16a34a; color:#fff}
.choice button.wrong{background:#dc2626; border-color:#dc2626; color:#fff}
.choice button[disabled]{cursor:not-allowed}
.fld input.subin{-webkit-appearance:none; appearance:none; min-height:52px; width:min(14rem,100%); border-radius:14px; border:3px solid #c4b5fd; padding:.4rem .9rem; font:inherit; font-size:1.25rem; font-weight:800; background:#fff}
.fld input.subin:focus{border-color:#7c3aed; outline:none; box-shadow:0 0 0 4px #ddd6fe}
.fld input.subin.good{border-color:#16a34a; background:#dcfce7}
.fld input.subin.bad{border-color:#dc2626; background:#fee2e2}
.actions{display:flex; flex-wrap:wrap; gap:.7rem; align-items:center; margin-top:.6rem}
.fb{margin-top:1rem; border-radius:20px; padding:1rem 1.2rem; animation:pop .25s}
@keyframes pop{from{transform:scale(.96); opacity:0}}
.fb.ok{background:#dcfce7; border:3px solid #16a34a}
.fb.no{background:#fee2e2; border:3px solid #dc2626}
.fb.mid{background:#fef3c7; border:3px solid #d97706}
.fb.warn{background:#fef9c3; border:3px solid #ca8a04}
.fb strong{font-size:1.2rem}
.fb p{margin:.4rem 0}
.ansrow{background:#fff; border-radius:14px; padding:.4rem .7rem; font-size:1.15rem; margin:.4rem 0}
.rows{list-style:none; padding:0; margin:.5rem 0; display:grid; gap:.35rem}
.rows li{display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:center; background:#fff; border-radius:12px; padding:.4rem .7rem}
.rows .mk{font-weight:900; font-size:1.15rem}
.rows li.ok .mk{color:#15803d} .rows li.no .mk{color:#b91c1c}
.shellwrap{display:flex; flex-wrap:wrap; gap:.8rem; align-items:center; margin-top:.4rem}
.shells{width:150px; height:auto; flex:none}
.shellwrap .cap{margin:0; font-weight:700}
.slot.shake,.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.score-big{font-size:clamp(3rem,14vw,6rem); font-weight:900; line-height:1; margin:.2rem 0; background:linear-gradient(90deg,#0891b2,#7c3aed,#db2777,#ea580c); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent}
.center{text-align:center}
.stars{font-size:2rem; letter-spacing:4px}
.review{list-style:none; padding:0; margin:1rem 0; display:grid; gap:.5rem; text-align:left}
.review li{display:flex; gap:.5rem .8rem; align-items:center; padding:.5rem .8rem; border-radius:14px; background:#f5f3ff; flex-wrap:wrap}
.review li.ok{background:#dcfce7}
.review li.mid{background:#fef3c7}
.review li.no{background:#fee2e2}
.review .mk{font-weight:900; min-width:3.2rem}
.totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin:1rem 0}
.tot{border-radius:20px; padding:1rem; color:#fff; font-weight:800}
.tot b{display:block; font-size:2.4rem}
.tot.p1{background:linear-gradient(135deg,#0891b2,#6366f1)}
.tot.p2{background:linear-gradient(135deg,#db2777,#f97316)}
.tot.all{background:linear-gradient(135deg,#16a34a,#0d9488)}

details.helper,details.pad{padding:.4rem clamp(1rem,3vw,1.8rem)}
details summary{cursor:pointer; font-weight:900; font-size:1.05rem; min-height:44px; display:flex; align-items:center; list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸"; display:inline-block; width:1.2em; color:#7c3aed}
details[open] summary::before{content:"▾"}
.padtools{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.5rem 0}
.sw{width:36px; height:36px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #94a3b8; cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px #1b1b3a}
.mini{min-height:40px; padding:.3rem .9rem; border-radius:999px; border:2px solid #7c3aed; background:#fff; color:#4c1d95; font:inherit; font-weight:800; cursor:pointer}
.mini[aria-pressed="true"]{background:#7c3aed; color:#fff}
#pad{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; width:100%; height:220px; border-radius:16px; border:3px solid #c4b5fd; touch-action:none; cursor:crosshair; display:block; background:#fff linear-gradient(#e0e7ff 1px,transparent 1px) 0 0/100% 28px}

.confetti{position:fixed; top:0; right:0; bottom:0; left:0; pointer-events:none; overflow:hidden; z-index:50}
.confetti i{position:absolute; top:-20px; width:10px; height:15px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.btn,.key,.choice button,.sw,.mini,.brand,summary,.etile{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.kbd{margin:.3rem 0 .2rem}
footer{color:#fff; text-align:center; opacity:.9; font-size:.9rem}

@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
@media print{
  body{background:#fff}
  .blobs,header.top .tools,.pad,.helper,.btn,.actions{display:none!important}
  .card{box-shadow:none; border:2px solid #ccc}
}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="Back to start">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><b></b></span> Electron Configuration Lab
    </button>
    <div class="tools">
      <span class="pill" id="pill" hidden></span>
      <button class="btn light" id="mute" type="button" aria-pressed="false" aria-label="Sound on">🔊</button>
    </div>
  </header>

  <main id="app"></main>

  <details id="padWrap" class="card pad" hidden>
    <summary>✏️ Scratchpad — work it out with a pen, finger or mouse</summary>
    <div class="padtools">
      <button class="sw" data-c="#1b1b3a" style="background:#1b1b3a" aria-label="Black ink" aria-pressed="true"></button>
      <button class="sw" data-c="#dc2626" style="background:#dc2626" aria-label="Red ink" aria-pressed="false"></button>
      <button class="sw" data-c="#2563eb" style="background:#2563eb" aria-label="Blue ink" aria-pressed="false"></button>
      <button class="sw" data-c="#16a34a" style="background:#16a34a" aria-label="Green ink" aria-pressed="false"></button>
      <button class="mini" id="padErase" type="button" aria-pressed="false">Eraser</button>
      <button class="mini" id="padClear" type="button">Clear</button>
    </div>
    <canvas id="pad" aria-label="Scratchpad drawing area"></canvas>
  </details>

  <footer>Questions use neutral atoms of elements 1–36. Exceptions such as chromium and copper are not asked.</footer>
</div>
<noscript><p style="color:#fff;text-align:center">Please turn on JavaScript to use this activity.</p></noscript>

<script>
(() => {
'use strict';

/* ---------- data ---------- */
const SYM = "H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr".split(' ');
const NAMES = "Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium Magnesium Aluminum Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium Scandium Titanium Vanadium Chromium Manganese Iron Cobalt Nickel Copper Zinc Gallium Germanium Arsenic Selenium Bromine Krypton".split(' ');
const ORDER = [[1,'s'],[2,'s'],[2,'p'],[3,'s'],[3,'p'],[4,'s'],[3,'d'],[4,'p'],[5,'s'],[4,'d'],[5,'p'],[6,'s'],[4,'f'],[5,'d'],[6,'p'],[7,'s'],[5,'f'],[6,'d'],[7,'p']];
const CAP = {s:2, p:6, d:10, f:14};
const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const CORES = {He:2, Ne:10, Ar:18, Kr:36};
const EXCEPTIONS = [24, 29];            /* Cr, Cu are not asked */

function cfgOf(Z){
  let left = Z; const list = [];
  for (const [n,l] of ORDER){ if (left <= 0) break; const e = Math.min(CAP[l], left); list.push({n, l, e}); left -= e; }
  return list;
}
function facts(Z){
  const list = cfgOf(Z), maxN = Math.max(...list.map(x => x.n)), last = list[list.length-1];
  return {Z, sym:SYM[Z-1], name:NAMES[Z-1], list, n:maxN, last, blk:last.l,
          val:list.filter(x => x.n === maxN).reduce((a,x) => a + x.e, 0)};
}
const cmp = (a,b) => a.n - b.n || 'spdf'.indexOf(a.l) - 'spdf'.indexOf(b.l);
const key = l => l.map(x => `${x.n}${x.l}${x.e}`).join(' ');

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const range = (a,b) => { const o=[]; for (let i=a;i<=b;i++) o.push(i); return o; };
const pick = (arr, n) => shuffle(arr).slice(0, n);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(_){ } }
};
const deSup = s => String(s).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => SUPD.indexOf(c));

function chips(list){ return list.map(x => `<span class="sl ${x.l}">${x.n}${x.l}<sup>${x.e}</sup></span>`).join(' '); }
function shortForm(Z){
  if (Z < 3) return '';
  const core = Z >= 19 ? 'Ar' : Z >= 11 ? 'Ne' : 'He';
  const rest = cfgOf(Z).slice(cfgOf(CORES[core]).length);
  return `<span class="sl core">[${core}]</span> ${chips(rest)}`;
}
function perShell(f){ const per = {}; f.list.forEach(x => per[x.n] = (per[x.n]||0) + x.e); return Object.keys(per).map(Number).sort((a,b) => a-b).map(n => per[n]); }

function parseConfig(raw){
  let s = deSup(raw).replace(/\^/g,'').replace(/[,;·•]/g,' ').trim();
  if (!s) return {ok:false, err:'empty'};
  let list = [];
  const m = s.match(/^\[\s*(He|Ne|Ar|Kr)\s*\]/i);
  if (m){
    const nm = m[1][0].toUpperCase() + m[1][1].toLowerCase();
    list = cfgOf(CORES[nm]);
    s = s.slice(m[0].length).trim();
  }
  for (const p of (s ? s.split(/\s+/) : [])){
    const t = p.match(/^([1-7])([spdfSPDF])(\d{1,2})$/);
    if (!t) return {ok:false, err:'format', bad:p};
    list.push({n:+t[1], l:t[2].toLowerCase(), e:+t[3]});
  }
  return {ok:true, list};
}
function parseSub(raw){
  const t = deSup(raw).replace(/[\s\^]/g,'').toLowerCase().match(/^([1-7])([spdf])(\d{1,2})$/);
  return t ? {n:+t[1], l:t[2], e:+t[3]} : null;
}

/* ---------- question sets ---------- */
function buildP1(){
  const ok = z => !EXCEPTIONS.includes(z);
  const zs = [...pick(range(1,10).filter(ok),2), ...pick(range(11,18).filter(ok),3), ...pick(range(19,36).filter(ok),5)].sort((a,b) => a-b);
  return zs.map(facts);
}
function buildP2(){
  const ok = z => !EXCEPTIONS.includes(z);
  const sB = [1,3,4,11,12,19,20], pB = [5,6,7,8,9,10,13,14,15,16,17,18,31,32,33,34,35,36], dB = [21,22,23,25,26,27,28,30];
  const chosen = [...pick(sB,1), ...pick(pB,2), ...pick(dB,1)];
  const rest = [...sB, ...pB, ...dB].filter(z => !chosen.includes(z) && ok(z));
  chosen.push(...pick(rest,1));
  return chosen.sort((a,b) => a-b).map(facts);
}

function ac(){
  if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
  if (ctx && ctx.state !== 'running'){ try{ const pr = ctx.resume(); if (pr && pr.catch) pr.catch(() => {}); }catch(_){} }
  if (ctx && !ac.unlocked){            /* iOS/iPadOS: play a silent buffer inside a tap to unlock audio */
    try{ const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); ac.unlocked = true; }catch(_){}
  }
  return ctx;
}
function tone(f, t0, d, type='sine', v=.2){
  const c = ac(); if (!c || muted) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + d + .05);
}

/* ---------- pictures ---------- */
function aufbauSvg(){
  const col = {s:0,p:1,d:2,f:3}, clr = {s:'#db2777',p:'#0e7490',d:'#c2410c',f:'#15803d'}, tint = {s:'#fce7f3',p:'#cffafe',d:'#ffedd5',f:'#dcfce7'};
  const X = l => 70 + col[l]*82, Y = n => 34 + (n-1)*38;
  let o = `<svg class="aufbau" viewBox="0 0 370 285" role="img" aria-label="Aufbau diagram. Sublevels in filling order: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>`;
  'spdf'.split('').forEach(l => o += `<text x="${X(l)}" y="14" text-anchor="middle" font-weight="900" font-size="15" fill="${clr[l]}">${l}</text>`);
  range(1,7).forEach(n => o += `<text x="6" y="${Y(n)+4}" font-size="11" font-weight="800" fill="#475569">n=${n}</text>`);
  const groups = {};
  ORDER.forEach(([n,l]) => { const k = n + col[l]; (groups[k] = groups[k] || []).push([n,l]); });
  const edge = (ux,uy) => Math.min(30/Math.abs(ux||1e-9), 13/Math.abs(uy||1e-9)) + 4;
  Object.values(groups).forEach(g => {
    if (g.length < 2) return;
    const [n1,l1] = g[0], [n2,l2] = g[g.length-1];
    const x1 = X(l1), y1 = Y(n1), x2 = X(l2), y2 = Y(n2), len = Math.hypot(x2-x1, y2-y1), ux = (x2-x1)/len, uy = (y2-y1)/len, t = edge(ux,uy);
    o += `<line x1="${(x1+ux*t).toFixed(1)}" y1="${(y1+uy*t).toFixed(1)}" x2="${(x2-ux*t).toFixed(1)}" y2="${(y2-uy*t).toFixed(1)}" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)"/>`;
  });
  ORDER.forEach(([n,l], i) => {
    o += `<rect x="${X(l)-30}" y="${Y(n)-13}" width="60" height="26" rx="8" fill="${tint[l]}" stroke="${clr[l]}" stroke-width="2"/>
          <text x="${X(l)-7}" y="${Y(n)+5}" text-anchor="middle" font-weight="900" font-size="14" fill="#1b1b3a">${n}${l}</text>
          <text x="${X(l)+20}" y="${Y(n)+4}" text-anchor="middle" font-size="9" font-weight="800" fill="#64748b">${i+1}</text>`;
  });
  return o + '</svg>';
}
function shellSvg(f){
  const per = perShell(f), R0 = 22, DR = 15, maxR = R0 + (per.length-1)*DR, size = 2*(maxR+12), c = size/2;
  const cols = ['#06b6d4','#a855f7','#f97316','#22c55e','#ec4899'];
  let g = `<svg class="shells" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(f.name)} atom: electrons per energy level ${per.join(', ')}">
    <circle cx="${c}" cy="${c}" r="15" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
    <text x="${c}" y="${c+4}" text-anchor="middle" font-size="10" font-weight="900" fill="#1b1b3a">${f.Z}+</text>`;
  per.forEach((cnt, i) => {
    const r = R0 + i*DR, outer = i === per.length-1, col = cols[i % cols.length];
    g += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    for (let k=0;k<cnt;k++){
      const a = -Math.PI/2 + 2*Math.PI*k/cnt;
      g += `<circle cx="${(c + r*Math.cos(a)).toFixed(1)}" cy="${(c + r*Math.sin(a)).toFixed(1)}" r="${outer?4.2:3.6}" fill="${outer?'#f59e0b':col}" ${outer?'stroke="#1b1b3a" stroke-width="1"':''}/>`;
    }
  });
  return g + '</svg>';
}

function updatePrev(){
  const f = S.qs[S.i], box = $('#prev'); if (!box) return;
  const raw = deSup($('#cfg').value).replace(/\^/g,'').trim();
  if (!raw){ box.innerHTML = '<span class="ph">Your configuration will appear here.</span>'; return; }
  let total = 0, html = '';
  for (const p of raw.split(/\s+/)){
    const c = p.match(/^\[(He|Ne|Ar|Kr)\]$/i), m = p.match(/^([1-7])([spdf])(\d{0,2})$/i);
    if (c){ const nm = c[1][0].toUpperCase() + c[1][1].toLowerCase(); total += CORES[nm]; html += `<span class="sl core">[${nm}]</span> `; }
    else if (m){ total += +m[3] || 0; html += `<span class="sl ${m[2].toLowerCase()}">${m[1]}${m[2].toLowerCase()}${m[3] ? `<sup>${m[3]}</sup>` : ''}</span> `; }
    else html += `<span class="sl bad">${esc(p)}</span> `;
  }
  const cls = total === f.Z ? 'ok' : total > f.Z ? 'over' : '';
  box.innerHTML = `${html}<span class="cnt ${cls}">Electrons placed: ${total} of ${f.Z}</span>`;
}

/* ---------- checking ---------- */
function check(){
  if (S.answered) return;
  ac();
  S.part === 1 ? checkP1() : checkP2();

function checkP1(){
  const f = S.qs[S.i], raw = $('#cfg').value, r = parseConfig(raw);
  if (!r.ok) return warn(r.err === 'empty' ? 'Type or tap your electron configuration first.' : `I could not read “${esc(r.bad)}”. Write each sublevel like 2p6 and put a space between sublevels.`);
  const stu = r.list, exp = f.list, shellOrd = exp.slice().sort(cmp);
  const ok = key(stu) === key(exp) || key(stu) === key(shellOrd);
  let msg = '';
  if (!ok){
    const tot = stu.reduce((a,x) => a + x.e, 0), over = stu.find(x => x.e > CAP[x.l]);
    if (over) msg = `${over.n}${over.l} can hold only ${CAP[over.l]} electrons.`;
    else if (tot !== f.Z) msg = `Your electrons add up to ${tot}, but ${f.name} has ${f.Z}.`;
    else if (key(stu.slice().sort(cmp)) === key(exp.slice().sort(cmp))) msg = 'You have the right sublevels, but the order should follow the Aufbau arrows.';
    else msg = 'Some electrons are in the wrong sublevels. Fill each sublevel to its limit (s 2, p 6, d 10, f 14) before moving on to the next one in the Aufbau order.';
  }
  lock(); S.answered = true; S.res[S.i] = ok ? 1 : 0; if (ok) S.score++; updatePill();
  $('#cfg').classList.add(ok ? 'good' : 'bad');
  $('.dots').outerHTML = dots();
  const sf = shortForm(f.Z), last = S.i === S.qs.length - 1;
  const explain = `<div class="ansrow">${chips(f.list)}</div>${sf ? `<p>Short form: ${sf}</p>` : ''}
    <p>Filling order used: ${ORDER.slice(0, f.list.length).map(([n,l]) => n + l).join(' → ')}.</p>
    <div class="shellwrap">${shellSvg(f)}<p class="cap">Electrons in each energy level: <b>${perShell(f).join(', ')}</b></p></div>`;
  S.reviews[0].push({pts: ok ? 1 : 0, max: 1, html: `<span class="mk">${ok ? '✔' : '✘'}</span><span><b>${f.Z} ${f.sym}</b></span><span>${chips(f.list)}</span>`});
  ok ? sfx.ok() : sfx.bad();
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><strong>${ok ? '✔ Correct! +1 point' : '✘ Not quite.'}</strong>${ok ? '' : `<p>${msg}</p><p>The correct configuration is:</p>`}${explain}
    <button class="btn green" id="next" type="button">${last ? 'See my score 🏁' : 'Next question →'}</button></div>`;
  const nx = $('#next'); nx.addEventListener('click', next); nx.focus();
}

function checkP2(){
  const f = S.qs[S.i], sub = parseSub($('#sub').value);
  if (S.sel.n === null || S.sel.blk === null || S.sel.val === null) return warn('Answer all four questions first (energy level, block and valence electrons are tap buttons).');
  if (!sub) return warn('For question ②, write the sublevel and its electrons, like 3p4.');
  const ok = {
    n: S.sel.n === f.n,
    sub: sub.n === f.last.n && sub.l === f.last.l && sub.e === f.last.e,
    blk: S.sel.blk === f.blk,
    val: S.sel.val === f.val
  };
  const pts = Object.values(ok).filter(Boolean).length;
  lock(); S.answered = true; S.res[S.i] = pts; S.score += pts; updatePill();
  $('.dots').outerHTML = dots();
  $('#sub').classList.add(ok.sub ? 'good' : 'bad');
  $('#tile').classList.add('b-' + f.blk);
  const mark = (g, correct) => app.querySelectorAll(`[data-grp="${g}"]`).forEach(b => {
    if (b.dataset.v === String(correct)) b.classList.add('right');
    else if (b.getAttribute('aria-pressed') === 'true') b.classList.add('wrong');
  });
  mark('n', f.n); mark('blk', f.blk); mark('val', f.val);
  const lastTxt = `${f.last.n}${f.last.l}<sup>${f.last.e}</sup>`, userSub = `${sub.n}${sub.l}<sup>${sub.e}</sup>`;
  const row = (okk, label, mine, right) => `<li class="${okk ? 'ok' : 'no'}"><span class="mk">${okk ? '✔' : '✘'}</span><span>${label}:</span><span>${okk ? `<b>${right}</b>` : `you said ${mine} — answer <b>${right}</b>`}</span></li>`;
  const outer = f.list.filter(x => x.n === f.n);
  const valTxt = outer.map(x => `${x.n}${x.l}<sup>${x.e}</sup> → ${x.e}`).join(', ');
  const last = S.i === S.qs.length - 1, cls = pts === 4 ? 'ok' : pts > 0 ? 'mid' : 'no';
  S.reviews[1].push({pts, max: 4, html: `<span class="mk">${pts}/4</span><span><b>${f.Z} ${f.sym}</b></span><span>n = ${f.n} · ${lastTxt} · ${f.blk}-block · ${f.val} valence e⁻</span>`});
  pts === 4 ? sfx.ok() : pts > 0 ? sfx.mid() : sfx.bad();
  $('#fb').innerHTML = `<div class="fb ${cls}"><strong>${pts === 4 ? '✔ Perfect! +4 points' : `You earned ${pts} of 4 points`}</strong>
    <ul class="rows">
      ${row(ok.n, '① Energy level', S.sel.n, 'n = ' + f.n)}
      ${row(ok.sub, '② Last sub-energy level', userSub, lastTxt)}
      ${row(ok.blk, '③ Block', S.sel.blk, f.blk + '-block')}
      ${row(ok.val, '④ Valence electrons', S.sel.val, f.val)}
    </ul>
    <p>Full configuration:</p><div class="ansrow">${chips(f.list)}</div>
    <p>The last electron enters <b>${lastTxt}</b>, so the block is <b>${f.blk}</b>. The highest energy level is <b>n = ${f.n}</b>. Valence electrons are the electrons in that level: ${valTxt} = <b>${f.val}</b>.</p>
    <div class="shellwrap">${shellSvg(f)}<p class="cap">Electrons in each energy level: <b>${perShell(f).join(', ')}</b></p></div>
    <button class="btn green" id="next" type="button">${last ? 'See my score 🏁' : 'Next element →'}</button></div>`;
  const nx = $('#next'); nx.addEventListener('click', next); nx.focus();
}

function lock(){ app.querySelectorAll('input, .key, .choice button, #check').forEach(el => el.disabled = true); }
function next(){ sfx.click(); if (S.i < S.qs.length - 1){ S.i++; renderQ(); } else partDone(); }

/* ---------- results ---------- */
function medal(r){ return r === 1 ? '🥇' : r >= .8 ? '🥈' : r >= .6 ? '🥉' : '🎯'; }
function msgFor(r){
  return r === 1 ? 'Perfect score! You are an electron configuration champion! ⚛️🏆'
    : r >= .8 ? 'Fantastic work! Almost perfect!'
    : r >= .6 ? 'Good job! A little more practice and you will have it.'
    : r >= .4 ? 'Keep going! Review the Aufbau chart and try again.'
    : 'Do not give up. Every scientist starts here!';
}
function reviewHtml(p){
  return `<ul class="review">${S.reviews[p-1].map((r,i) => `<li class="${r.pts === r.max ? 'ok' : r.pts > 0 ? 'mid' : 'no'}"><span>${i+1}.</span>${r.html}</li>`).join('')}</ul>`;
}
function partDone(){
  const p = S.part, ratio = S.score / S.max;
  S.scores[p-1] = S.score; padWrap.hidden = true; updatePill();
  sfx.win(); if (ratio >= .8) confetti();
  const both = S.scores[0] !== null && S.scores[1] !== null, more = S.chain && p === 1;
  app.innerHTML = `
  <section class="card center">
    <span class="badge p${p}">Part ${p} complete</span>
    <div class="stars" aria-hidden="true">${medal(ratio)}</div>
    <div class="score-big" aria-label="Score ${S.score} out of ${S.max}">${S.score}<span style="font-size:.4em"> / ${S.max}</span></div>
    <p class="lead">${msgFor(ratio)}</p>
    ${reviewHtml(p)}
    <div class="actions" style="justify-content:center">
      <button class="btn ${more ? 'b2' : 'primary'} big" id="go" type="button">${more ? 'Start Part 2 →' : both ? 'See total score 🏁' : 'Back to start'}</button>
      <button class="btn light" id="again" type="button">↻ Try Part ${p} again</button>
    </div>
  </section>`;
  $('#go').addEventListener('click', () => { sfx.click(); if (more) startPart(2, true); else if (both) finalScreen(); else home(); });
  $('#again').addEventListener('click', () => { sfx.click(); startPart(p, S.chain); });
  $('#go').focus();
}
function finalScreen(){
  const [a, b] = S.scores, tot = (a||0) + (b||0), prev = parseInt(store.get('ecl-best') || '0', 10);
  if (a !== null && b !== null && tot > prev) store.set('ecl-best', String(tot));
  sfx.win(); if (tot >= 24) confetti();
  const date = new Date().toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
  app.innerHTML = `
  <section class="card center">
    <div class="stars" aria-hidden="true">${tot >= 27 ? '🏆' : tot >= 21 ? '🌟' : tot >= 15 ? '👍' : '🎯'}</div>
    <h2 style="font-size:1.8rem;margin:.2rem 0" tabindex="-1">${S.name ? esc(S.name) + ', your' : 'Your'} results</h2>
    <div class="totals">
      <div class="tot p1">Part 1 · Configuration<b>${a === null ? '—' : a} / 10</b></div>
      <div class="tot p2">Part 2 · Levels, block, valence<b>${b === null ? '—' : b} / 20</b></div>
      <div class="tot all">Total score<b>${tot} / 30</b></div>
    </div>
    <p class="lead">${msgFor(tot / 30)}</p>
    <p class="sub">${date}</p>
    <div class="actions" style="justify-content:center">
      <button class="btn primary big" id="redo" type="button">↻ Play again (new questions)</button>
      <button class="btn light" id="print" type="button">🖨 Print results</button>
      <button class="btn light" id="home" type="button">Home</button>
    </div>
  </section>`;
  $('#redo').addEventListener('click', () => { sfx.click(); S.scores = [null,null]; startPart(1, true); });
  $('#print').addEventListener('click', () => window.print());
  $('#home').addEventListener('click', () => { sfx.click(); home(); });
  $('#redo').focus();
}

/* ---------- scratchpad (pen, touch, mouse) ---------- */
const pad = $('#pad'), pctx = pad.getContext('2d');
let pcol = '#1b1b3a', erase = false, drawing = false, lastPt = null;
function fitPad(){
  const r = pad.getBoundingClientRect(); if (!r.width) return;
  const dpr = window.devicePixelRatio || 1, w = Math.round(r.width*dpr), h = Math.round(r.height*dpr);
  if (pad.width === w && pad.height === h) return;
  const tmp = document.createElement('canvas'); tmp.width = pad.width; tmp.height = pad.height; tmp.getContext('2d').drawImage(pad, 0, 0);
  pad.width = w; pad.height = h; pctx.drawImage(tmp, 0, 0, tmp.width, tmp.height, 0, 0, w, h);   /* keep the drawing when the tablet rotates */
}
function clearPad(){ pctx.clearRect(0, 0, pad.width, pad.height); }
function pt(e){ const r = pad.getBoundingClientRect(); return [(e.clientX - r.left)*pad.width/r.width, (e.clientY - r.top)*pad.height/r.height]; }
function stroke(e){
  const dpr = window.devicePixelRatio || 1, p = pt(e);
  pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  pctx.strokeStyle = pcol;
  pctx.lineWidth = (erase ? 26 : (e.pointerType === 'pen' ? 1.5 + (e.pressure || .5)*5 : 3)) * dpr;
  pctx.beginPath(); pctx.moveTo(lastPt[0], lastPt[1]); pctx.lineTo(p[0] + .01, p[1]); pctx.stroke(); lastPt = p;
}
pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); drawing = true; lastPt = pt(e); stroke(e); });
pad.addEventListener('pointermove', e => { if (drawing){ e.preventDefault(); stroke(e); } });
['pointerup','pointercancel'].forEach(t => pad.addEventListener(t, () => { drawing = false; }));
padWrap.addEventListener('toggle', () => { if (padWrap.open) fitPad(); });
window.addEventListener('resize', () => { if (padWrap.open) fitPad(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if (padWrap.open) fitPad(); }, 250));
$('#padClear').addEventListener('click', clearPad);
$('#padErase').addEventListener('click', e => { erase = !erase; e.currentTarget.setAttribute('aria-pressed', erase); });
padWrap.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
  pcol = b.dataset.c; erase = false; $('#padErase').setAttribute('aria-pressed', 'false');
  padWrap.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b));
}));

/* ---------- global ---------- */
$('#brand').addEventListener('click', () => { if (!S.part || confirm('Leave this activity and go back to the start? Your progress in this part will be lost.')) home(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.tagName === 'INPUT' && (t.id === 'cfg' || t.id === 'sub')){ e.preventDefault(); if (S.answered){ const n = $('#next'); n && n.click(); } else check(); }
});

window.__ecl = {facts, cfgOf, parseConfig, parseSub, buildP1, buildP2, S, ORDER};
home();
})();
</script>
