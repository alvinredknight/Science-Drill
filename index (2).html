<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c1d95">
<title>Radioactive Decay Lab</title>
<style>
:root{
  --ink:#1b1b3a; --muted:#5b5b7a;
  --alpha:#d90429; --bminus:#2563eb; --bplus:#c2410c; --gamma:#7c3aed;
  --p1:#0e7490; --p2:#be185d; --ok:#15803d; --no:#b91c1c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 35%,#be185d 70%,#f97316 100%);
  background-attachment:fixed;
}
.blobs{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
.blobs i{position:absolute; border-radius:50%; filter:blur(50px); opacity:.45; animation:float 14s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:340px;height:340px;background:#22d3ee;left:-80px;top:10%}
.blobs i:nth-child(2){width:300px;height:300px;background:#facc15;right:-60px;top:45%;animation-delay:-5s}
.blobs i:nth-child(3){width:380px;height:380px;background:#f472b6;left:30%;bottom:-140px;animation-delay:-9s}
@keyframes float{to{transform:translate(40px,-50px) scale(1.15)}}
.wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:0 clamp(.6rem,3vw,1.4rem) 3rem}

header.top{
  display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; justify-content:space-between;
  padding:1rem 0; color:#fff;
}
.brand{display:flex; align-items:center; gap:.7rem; font-weight:900; font-size:clamp(1.2rem,3.5vw,1.7rem); cursor:pointer; background:none; border:0; color:#fff; font-family:inherit; padding:0}
.logo{width:40px; height:40px; position:relative; flex:none}
.logo b{position:absolute; left:15px; top:15px; width:10px; height:10px; border-radius:50%; background:#fde047; box-shadow:0 0 12px #fde047}
.logo i{position:absolute; inset:2px 0; border:3px solid #67e8f9; border-radius:50%}
.logo i:nth-child(2){transform:rotate(60deg); border-color:#f9a8d4}
.logo i:nth-child(3){transform:rotate(-60deg); border-color:#bef264}
.tools{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center}
.pill{background:rgba(255,255,255,.95); color:var(--ink); border-radius:999px; padding:.45rem .9rem; font-weight:800; font-size:.95rem; min-height:44px; display:inline-flex; align-items:center}

.btn{
  min-height:48px; padding:.7rem 1.3rem; border:0; border-radius:999px; font:inherit; font-weight:800; cursor:pointer;
  color:#fff; background:#4c1d95; box-shadow:0 5px 0 rgba(0,0,0,.25); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
  touch-action:manipulation;
}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(90deg,#db2777,#f97316)}
.btn.b1{background:linear-gradient(90deg,#0891b2,#2563eb)}
.btn.b2{background:linear-gradient(90deg,#db2777,#f97316)}
.btn.light{background:#fff; color:#4c1d95}
.btn.green{background:linear-gradient(90deg,#16a34a,#0d9488)}
.btn.big{font-size:1.2rem; min-height:58px; padding:.8rem 2rem}
.btn[disabled]{opacity:.5; cursor:not-allowed}
:focus-visible{outline:4px solid #fde047; outline-offset:2px}

.card{background:rgba(255,255,255,.96); border-radius:26px; padding:clamp(1rem,3vw,1.8rem); box-shadow:0 12px 34px rgba(0,0,0,.3); margin-bottom:1.2rem}
.hero{text-align:center}
.hero h1{font-size:clamp(1.9rem,6vw,3rem); margin:.3rem 0; background:linear-gradient(90deg,#0891b2,#7c3aed,#db2777,#ea580c); -webkit-background-clip:text; background-clip:text; color:transparent}
.lead{font-size:1.15rem; color:var(--muted); margin:.2rem 0 1rem}
.atom{width:96px; height:96px; margin:0 auto; position:relative}
.atom b{position:absolute; left:38px; top:38px; width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 30% 30%,#fff7ae,#f59e0b); box-shadow:0 0 22px #fbbf24}
.atom i{position:absolute; inset:14px 0; border:4px solid #06b6d4; border-radius:50%; animation:spin 6s linear infinite}
.atom i:nth-child(2){border-color:#ec4899; transform:rotate(60deg); animation-duration:8s}
.atom i:nth-child(3){border-color:#84cc16; transform:rotate(-60deg); animation-duration:10s}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.field{display:block; margin:.6rem auto 1.2rem; max-width:360px; text-align:left; font-weight:800}
.field input{width:100%; margin-top:.3rem; min-height:48px; border-radius:14px; border:3px solid #c4b5fd; padding:.5rem .9rem; font:inherit; font-weight:600}
.parts{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin-bottom:1.2rem; text-align:left}
.pcard{border-radius:22px; padding:1.1rem 1.2rem; color:#fff}
.pcard.p1{background:linear-gradient(135deg,#0891b2,#6366f1)}
.pcard.p2{background:linear-gradient(135deg,#db2777,#f97316)}
.pcard h2{margin:.1rem 0 .3rem; font-size:1.25rem}
.pcard p{margin:.2rem 0 .8rem}
.pcard .btn{background:#fff; color:var(--ink)}
.best{margin-top:1rem; color:var(--muted); font-weight:700}

table.rules{width:100%; border-collapse:separate; border-spacing:0 6px; font-size:.98rem}
table.rules th{text-align:left; padding:.3rem .6rem; color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.5px}
table.rules td{padding:.55rem .6rem; background:#f5f3ff}
table.rules td:first-child{border-radius:12px 0 0 12px; font-weight:900; color:#fff; background:var(--c)}
table.rules td:last-child{border-radius:0 12px 12px 0}
.rulescroll{overflow-x:auto}

/* quiz */
.qhead{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; justify-content:space-between}
.badge{display:inline-block; color:#fff; font-weight:900; padding:.4rem .9rem; border-radius:999px}
.badge.p1{background:linear-gradient(90deg,#0891b2,#6366f1)}
.badge.p2{background:linear-gradient(90deg,#db2777,#f97316)}
.dots{display:flex; gap:6px; margin:.9rem 0 .3rem}
.dots i{flex:1; height:12px; border-radius:99px; background:#e5e7eb}
.dots i.now{background:#fde047; box-shadow:0 0 0 2px #f59e0b inset}
.dots i.ok{background:#22c55e}
.dots i.no{background:#ef4444}
h2.q{font-size:clamp(1.15rem,3.4vw,1.5rem); margin:.8rem 0 .2rem}
.sub{color:var(--muted); margin:.1rem 0 .8rem}
.equation{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.6rem 1.1rem; padding:1.3rem .6rem; margin:.5rem 0 1rem;
  font-size:clamp(1.9rem,6vw,3rem); font-weight:900; border-radius:22px; background:linear-gradient(135deg,#ecfeff,#fdf4ff,#fff7ed);
  border:3px dashed #c4b5fd;
}
.nuc{display:inline-flex; align-items:center; gap:.12em}
.nn{display:flex; flex-direction:column; align-items:flex-end; font-size:.42em; line-height:1.15; font-weight:800; min-width:1.2em}
.nn span{display:block}
.arrow{display:inline-flex; flex-direction:column; align-items:center; line-height:1; color:var(--c,var(--ink))}
.arrow small{font-size:.3em; font-weight:800}
.plus{opacity:.6}
.pcol{color:var(--c)}
.slot{padding:.3rem .5rem; border-radius:16px; background:#fffbeb; border:3px solid #fbbf24; transition:box-shadow .2s}
.slot.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slot .nn{font-size:1rem; gap:4px; align-items:center}
.slot input{
  width:3.6rem; min-height:2.5rem; text-align:center; font:inherit; font-size:1.15rem; font-weight:800; color:var(--ink);
  border:3px solid #cbd5e1; border-radius:10px; background:#fff; padding:0 .2rem;
}
.slot input.sym{width:5.4rem; min-height:3.4rem; font-size:1.7rem}
.slot input.sym.wide{width:min(11.5rem,46vw); font-size:1.25rem}
.slot input:focus{border-color:#7c3aed; outline:none; box-shadow:0 0 0 4px #ddd6fe}
.slot input.good{border-color:#16a34a; background:#dcfce7}
.slot input.bad{border-color:#dc2626; background:#fee2e2}
.slot .lab{font-size:.6rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
.toolbox{margin:.3rem 0 1rem}
.toolbox h3{margin:0 0 .4rem; font-size:.95rem; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:.6rem}
.chip{
  display:inline-flex; align-items:center; gap:.5rem; min-height:52px; padding:.35rem 1rem; border-radius:16px; background:#fff;
  border:3px solid var(--c); color:var(--c); font:inherit; font-weight:900; font-size:1.25rem; cursor:pointer; touch-action:manipulation;
}
.chip .cl{font-size:.85rem; color:var(--ink)}
.chip:active{transform:scale(.96)}
.chip:disabled{opacity:.5; cursor:not-allowed}
.chip .nuc{font-size:1.4rem}
.actions{display:flex; flex-wrap:wrap; gap:.7rem; align-items:center}
.fb{margin-top:1rem; border-radius:20px; padding:1rem 1.2rem; animation:pop .25s}
@keyframes pop{from{transform:scale(.96); opacity:0}}
.fb.ok{background:#dcfce7; border:3px solid #16a34a}
.fb.no{background:#fee2e2; border:3px solid #dc2626}
.fb.warn{background:#fef9c3; border:3px solid #ca8a04}
.fb strong{font-size:1.2rem}
.fb p{margin:.4rem 0}
.fb .ans{display:inline-flex; align-items:center; gap:.4rem; background:#fff; border-radius:12px; padding:.2rem .7rem; font-size:1.6rem; font-weight:900}
.pt-link{margin:.2rem 0 1rem}

/* results */
.score-big{font-size:clamp(3rem,14vw,6rem); font-weight:900; line-height:1; margin:.2rem 0; background:linear-gradient(90deg,#0891b2,#7c3aed,#db2777,#ea580c); -webkit-background-clip:text; background-clip:text; color:transparent}
.center{text-align:center}
.stars{font-size:2rem; letter-spacing:4px}
.review{list-style:none; padding:0; margin:1rem 0; display:grid; gap:.5rem; text-align:left}
.review li{display:flex; gap:.7rem; align-items:center; padding:.5rem .8rem; border-radius:14px; background:#f5f3ff; flex-wrap:wrap}
.review li.ok{background:#dcfce7}
.review li.no{background:#fee2e2}
.review .mk{font-weight:900; font-size:1.2rem}
.review .eq{font-weight:800}
.totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin:1rem 0}
.tot{border-radius:20px; padding:1rem; color:#fff; font-weight:800}
.tot b{display:block; font-size:2.4rem}
.tot.p1{background:linear-gradient(135deg,#0891b2,#6366f1)}
.tot.p2{background:linear-gradient(135deg,#db2777,#f97316)}
.tot.all{background:linear-gradient(135deg,#16a34a,#0d9488)}

/* scratchpad */
.pad summary{cursor:pointer; font-weight:900; font-size:1.05rem; min-height:44px; display:flex; align-items:center}
.padtools{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.5rem 0}
.sw{width:36px; height:36px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #94a3b8; cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px #1b1b3a}
.mini{min-height:40px; padding:.3rem .9rem; border-radius:999px; border:2px solid #7c3aed; background:#fff; color:#4c1d95; font:inherit; font-weight:800; cursor:pointer}
.mini[aria-pressed="true"]{background:#7c3aed; color:#fff}
#pad{
  width:100%; height:220px; border-radius:16px; border:3px solid #c4b5fd; touch-action:none; cursor:crosshair; display:block;
  background:#fff linear-gradient(#e0e7ff 1px,transparent 1px) 0 0/100% 28px;
}

.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
.confetti i{position:absolute; top:-20px; width:10px; height:15px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.sr{position:absolute; left:-9999px}
footer{color:#fff; text-align:center; opacity:.85; font-size:.9rem}

@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
@media print{
  body{background:#fff}
  .blobs,header.top .tools,.pad,.btn,.actions{display:none!important}
  .card{box-shadow:none; border:2px solid #ccc}
}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="Back to start">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><b></b></span> Radioactive Decay Lab
    </button>
    <div class="tools">
      <span class="pill" id="pill" hidden></span>
      <a class="btn light" href="periodic-table.html" target="_blank">🧪 Periodic Table</a>
      <button class="btn light" id="mute" type="button" aria-pressed="false" aria-label="Sound on">🔊</button>
    </div>
  </header>

  <main id="app" aria-live="off"></main>

  <details id="padWrap" class="card pad" hidden>
    <summary>✏️ Scratchpad — work it out with a pen, finger or mouse</summary>
    <div class="padtools">
      <button class="sw" data-c="#1b1b3a" style="background:#1b1b3a" aria-label="Black ink" aria-pressed="true"></button>
      <button class="sw" data-c="#dc2626" style="background:#dc2626" aria-label="Red ink" aria-pressed="false"></button>
      <button class="sw" data-c="#2563eb" style="background:#2563eb" aria-label="Blue ink" aria-pressed="false"></button>
      <button class="sw" data-c="#16a34a" style="background:#16a34a" aria-label="Green ink" aria-pressed="false"></button>
      <button class="mini" id="padErase" type="button" aria-pressed="false">Eraser</button>
      <button class="mini" id="padClear" type="button">Clear</button>
    </div>
    <canvas id="pad" aria-label="Scratchpad drawing area"></canvas>
  </details>

  <footer>Neutrinos are left out of the equations to keep them simple.</footer>
</div>
<noscript><p style="color:#fff;text-align:center">Please turn on JavaScript to use this activity.</p></noscript>

<script>
(() => {
'use strict';

/* ---------- element data ---------- */
const SYM = "H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(' ');
const NAMES = "Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium Magnesium Aluminium Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium Scandium Titanium Vanadium Chromium Manganese Iron Cobalt Nickel Copper Zinc Gallium Germanium Arsenic Selenium Bromine Krypton Rubidium Strontium Yttrium Zirconium Niobium Molybdenum Technetium Ruthenium Rhodium Palladium Silver Cadmium Indium Tin Antimony Tellurium Iodine Xenon Caesium Barium Lanthanum Cerium Praseodymium Neodymium Promethium Samarium Europium Gadolinium Terbium Dysprosium Holmium Erbium Thulium Ytterbium Lutetium Hafnium Tantalum Tungsten Rhenium Osmium Iridium Platinum Gold Mercury Thallium Lead Bismuth Polonium Astatine Radon Francium Radium Actinium Thorium Protactinium Uranium Neptunium Plutonium Americium Curium Berkelium Californium Einsteinium Fermium Mendelevium Nobelium Lawrencium Rutherfordium Dubnium Seaborgium Bohrium Hassium Meitnerium Darmstadtium Roentgenium Copernicium Nihonium Flerovium Moscovium Livermorium Tennessine Oganesson".split(' ');
const ZOF = {}; SYM.forEach((s,i) => ZOF[s] = i+1);
const ALT = {aluminum:13, cesium:55, sulphur:16};

/* ---------- decay rules ---------- */
const DECAY = {
  'a':  {name:'Alpha decay',      short:'α',  cv:'--alpha',  dA:-4, dZ:-2, p:{A:4, Z:2,  pz:'2',  sym:'He', shown:'He', label:'alpha particle'}},
  'b-': {name:'Beta-minus decay', short:'β⁻', cv:'--bminus', dA:0,  dZ:+1, p:{A:0, Z:-1, pz:'−1', sym:'e',  shown:'e',  label:'beta-minus particle (electron)'}},
  'b+': {name:'Beta-plus decay',  short:'β⁺', cv:'--bplus',  dA:0,  dZ:-1, p:{A:0, Z:1,  pz:'+1', sym:'e',  shown:'e',  label:'beta-plus particle (positron)'}},
  'g':  {name:'Gamma emission',   short:'γ',  cv:'--gamma',  dA:0,  dZ:0,  p:{A:0, Z:0,  pz:'0',  sym:'γ',  shown:'γ',  label:'gamma ray'}}
};
const ALLOW = {
  'a':  ['he','α','alpha','helium','alphaparticle'],
  'b-': ['e','e-','β','β-','beta','beta-','betaminus','electron','β⁻'],
  'b+': ['e','e+','β+','beta+','betaplus','positron','β⁺'],
  'g':  ['γ','gamma','g','gammaray','γ-ray','γray']
};
const PN = {'a':'an alpha particle (⁴₂He)', 'b-':'a beta-minus particle, an electron (⁰₋₁e)', 'b+':'a beta-plus particle, a positron (⁰₊₁e)', 'g':'a gamma ray (⁰₀γ)'};

/* [parent symbol, mass number, decay type, metastable?] */
const POOL = [
  ['U',238,'a'],['U',235,'a'],['Ra',226,'a'],['Rn',222,'a'],['Po',218,'a'],['Po',210,'a'],['Th',230,'a'],['Pu',239,'a'],['Am',241,'a'],['Po',214,'a'],['Th',232,'a'],['Cm',244,'a'],
  ['C',14,'b-'],['P',32,'b-'],['Co',60,'b-'],['Sr',90,'b-'],['Y',90,'b-'],['I',131,'b-'],['Cs',137,'b-'],['H',3,'b-'],['Th',234,'b-'],['Pb',214,'b-'],['Bi',214,'b-'],['Tc',99,'b-'],['K',40,'b-'],['Fe',59,'b-'],['Na',24,'b-'],
  ['C',11,'b+'],['N',13,'b+'],['O',15,'b+'],['F',18,'b+'],['Na',22,'b+'],['Ga',68,'b+'],['Rb',82,'b+'],['P',30,'b+'],
  ['Tc',99,'g',1],['Ba',137,'g',1],['Kr',81,'g',1],['Xe',133,'g',1]
];
const MIX = {'a':3, 'b-':3, 'b+':2, 'g':2};   /* 10 questions per part */

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const minus = n => n < 0 ? '−' + (-n) : String(n);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(_){ } }
};
const num = v => { v = String(v).trim().replace(/[−–—]/g,'-').replace(/^\+/,''); return /^-?\d+$/.test(v) ? parseInt(v,10) : NaN; };
const normS = v => String(v).trim().toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'');

function nuc(A, Z, sym, extra){
  return `<span class="nuc ${extra||''}"><span class="nn"><span>${A}</span><span>${Z}</span></span><span class="ns">${sym}</span></span>`;
}
const nucName = (sym, A, m) => `${NAMES[ZOF[sym]-1]}-${A}${m?'m':''}`;

function makeQ(e){
  const [ps, A, type, meta] = e;
  const Z = ZOF[ps], d = DECAY[type];
  const dZ = Z + d.dZ, dA = A + d.dA;
  return {type, parent:{sym:ps, Z, A, m:!!meta}, daughter:{sym:SYM[dZ-1], Z:dZ, A:dA, name:NAMES[dZ-1]}};
}
function buildSet(){
  let out = [];
  for (const t in MIX) out = out.concat(shuffle(POOL.filter(e => e[2] === t)).slice(0, MIX[t]));
  return shuffle(out).map(makeQ);
}

/* ---------- sound ---------- */
let ctx = null, muted = store.get('rdl-muted') === '1';
function ac(){
  if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
  if (ctx && ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function tone(f, t0, d, type='sine', v=.2){
  const c = ac(); if (!c || muted) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + d + .05);
}
const sfx = {
  click(){ tone(660, 0, .06, 'triangle', .12); },
  ok(){ [523,659,784,1047].forEach((f,i) => tone(f, i*.09, .24, 'triangle', .22)); },
  bad(){ tone(220, 0, .25, 'sawtooth', .16); tone(150, .18, .38, 'sawtooth', .16); },
  win(){ [523,659,784,659,784,1047,1319].forEach((f,i) => tone(f, i*.12, .3, 'triangle', .22)); },
  geiger(){ for (let i=0;i<5;i++) tone(1800 + Math.random()*800, i*.07 + Math.random()*.04, .02, 'square', .06); }
};
function speak(t){
  if (!('speechSynthesis' in window) || muted) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = .95; speechSynthesis.speak(u); }catch(_){}
}
const muteBtn = $('#mute');
function paintMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-pressed', muted); muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
muteBtn.addEventListener('click', () => { muted = !muted; store.set('rdl-muted', muted ? '1':'0'); paintMute(); if (!muted) sfx.click(); else { try{ speechSynthesis.cancel(); }catch(_){} } });
paintMute();

function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden','true');
  const cols = ['#f43f5e','#f59e0b','#22c55e','#06b6d4','#6366f1','#d946ef','#facc15'];
  for (let i=0;i<80;i++){
    const s = document.createElement('i');
    s.style.left = Math.random()*100 + '%';
    s.style.background = cols[i % cols.length];
    s.style.animationDelay = (Math.random()*.9) + 's';
    s.style.animationDuration = (2.6 + Math.random()*2.2) + 's';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 6500);
}

/* ---------- state ---------- */
const S = {name: store.get('rdl-name') || '', part:0, chain:false, qs:[], i:0, res:[], score:0, scores:[null,null], reviews:[[],[]], answered:false};
const pill = $('#pill');
function updatePill(){
  if (!S.part){ pill.hidden = true; return; }
  pill.hidden = false;
  pill.textContent = `Part ${S.part}: ${S.score}/10`;
}

/* ---------- screens ---------- */
function home(){
  S.part = 0; padWrap.hidden = true; updatePill();
  try{ speechSynthesis.cancel(); }catch(_){}
  const best = store.get('rdl-best');
  app.innerHTML = `
  <section class="card hero">
    <div class="atom" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <h1 tabindex="-1">Radioactive Decay Lab</h1>
    <p class="lead">Balance nuclear equations and find the new element! Two parts, <strong>10 points each</strong>.</p>
    <label class="field">Your name (optional)
      <input id="nm" autocomplete="name" maxlength="40" value="${esc(S.name)}" placeholder="Type your name">
    </label>
    <div class="parts">
      <article class="pcard p1">
        <h2>Part 1 · Missing Particle</h2>
        <p>Part of the nuclear equation is hidden. Work out the missing particle: its mass number, atomic number and symbol.</p>
        <button class="btn" data-start="1" type="button">Start Part 1 · 10 pts</button>
      </article>
      <article class="pcard p2">
        <h2>Part 2 · Daughter Element</h2>
        <p>A nucleus decays. Which element does it become? Give its mass number, atomic number and symbol.</p>
        <button class="btn" data-start="2" type="button">Start Part 2 · 10 pts</button>
      </article>
    </div>
    <button class="btn primary big" id="startAll" type="button">▶ Start the whole activity</button>
    ${best ? `<p class="best">🏆 Your best total: ${esc(best)} / 20</p>` : ''}
  </section>
  <section class="card">
    <h2 style="margin-top:0">📘 Quick review: the four kinds of decay</h2>
    <div class="rulescroll"><table class="rules">
      <thead><tr><th>Decay</th><th>Particle emitted</th><th>Mass number A</th><th>Atomic number Z</th><th>What happens</th></tr></thead>
      <tbody>
        <tr><td style="--c:var(--alpha)">α alpha</td><td>${nucInline(4,'2','He')}</td><td>decreases by 4</td><td>decreases by 2</td><td>The nucleus loses 2 protons and 2 neutrons.</td></tr>
        <tr><td style="--c:var(--bminus)">β⁻ beta-minus</td><td>${nucInline(0,'−1','e')}</td><td>no change</td><td>increases by 1</td><td>A neutron turns into a proton.</td></tr>
        <tr><td style="--c:var(--bplus)">β⁺ beta-plus</td><td>${nucInline(0,'+1','e')}</td><td>no change</td><td>decreases by 1</td><td>A proton turns into a neutron.</td></tr>
        <tr><td style="--c:var(--gamma)">γ gamma</td><td>${nucInline(0,'0','γ')}</td><td>no change</td><td>no change</td><td>Extra energy leaves the nucleus.</td></tr>
      </tbody>
    </table></div>
    <p class="sub">Remember: the mass numbers and the atomic numbers must add up to the same totals on both sides of the arrow. Use the Periodic Table to turn an atomic number into an element symbol.</p>
  </section>`;
  $('#nm').addEventListener('input', e => { S.name = e.target.value; store.set('rdl-name', S.name); });
  app.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => { ac(); sfx.geiger(); startPart(+b.dataset.start, false); }));
  $('#startAll').addEventListener('click', () => { ac(); sfx.geiger(); S.scores = [null,null]; startPart(1, true); });
}
function nucInline(A, Z, s){ return `<span style="font-size:1.4rem;font-weight:900">${nuc(A, Z, s)}</span>`; }

function startPart(p, chain){
  S.part = p; S.chain = chain; S.qs = buildSet(); S.i = 0; S.res = Array(10).fill(null); S.score = 0; S.reviews[p-1] = [];
  padWrap.hidden = false; padWrap.open = false;
  updatePill(); renderQ();
}

function dotsHtml(){
  return `<div class="dots" role="img" aria-label="Question ${S.i+1} of 10">${S.res.map((r,i) => `<i class="${r===true?'ok':r===false?'no':i===S.i?'now':''}"></i>`).join('')}</div>`;
}

function renderQ(){
  const q = S.qs[S.i], P = q.parent, D = q.daughter, d = DECAY[q.type];
  S.answered = false; clearPad();
  const pn = nucName(P.sym, P.A, P.m), dn = nucName(D.sym, D.A, false);
  const parentNuc = nuc(P.A + (P.m ? 'm' : ''), P.Z, P.sym);
  let body;
  if (S.part === 1){
    body = `
      <h2 class="q" tabindex="-1">What particle is missing from this equation?</h2>
      <p class="sub">${esc(pn)} decays into ${esc(dn)} and one particle. Type its <b>mass number</b> (top), <b>atomic number</b> (bottom) and <b>symbol</b>.</p>
      <div class="equation" role="group" aria-label="Nuclear equation with a missing particle">
        ${parentNuc}<span class="arrow" aria-label="decays to">→</span>${nuc(D.A, D.Z, D.sym)}<span class="plus">+</span>
        <span class="nuc slot" id="slot">
          <span class="nn">
            <input id="fA" inputmode="numeric" autocomplete="off" aria-label="Mass number of the missing particle" placeholder="A">
            <input id="fZ" inputmode="text" autocomplete="off" aria-label="Atomic number of the missing particle" placeholder="Z">
          </span>
          <input id="fS" class="sym" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="14" aria-label="Symbol of the missing particle" placeholder="?">
        </span>
      </div>
      <div class="toolbox">
        <h3>Particle toolbox — tap one to fill in the boxes (or type your own answer)</h3>
        <div class="chips">${['a','b-','b+','g'].map(k => {
          const p = DECAY[k].p;
          return `<button type="button" class="chip" data-chip="${k}" style="--c:var(${DECAY[k].cv})">${nuc(p.A, p.pz, p.shown)}<span class="cl">${DECAY[k].short} ${p.label.split(' (')[0]}</span></button>`;
        }).join('')}</div>
      </div>`;
  } else {
    const p = d.p;
    body = `
      <h2 class="q" tabindex="-1">Which element is made after this decay?</h2>
      <p class="sub"><b>${esc(pn)}</b> goes through <b style="color:var(${d.cv})">${d.name.toLowerCase()}</b>. Type the <b>mass number</b>, <b>atomic number</b> and <b>symbol</b> of the daughter element (the name works too).</p>
      <div class="equation" role="group" aria-label="Nuclear equation with a missing daughter nucleus">
        ${parentNuc}
        <span class="arrow" style="--c:var(${d.cv})" aria-label="${d.name}"><small>${d.short} decay</small>→</span>
        <span class="nuc slot" id="slot">
          <span class="nn">
            <input id="fA" inputmode="numeric" autocomplete="off" aria-label="Mass number of the daughter" placeholder="A">
            <input id="fZ" inputmode="numeric" autocomplete="off" aria-label="Atomic number of the daughter" placeholder="Z">
          </span>
          <input id="fS" class="sym wide" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="20" aria-label="Symbol or name of the daughter element" placeholder="symbol">
        </span>
        <span class="plus">+</span>${nuc(p.A, p.pz, p.shown, 'pcol" style="--c:var(' + d.cv + ')')}
      </div>
      <p class="pt-link"><a class="btn light" href="periodic-table.html" target="_blank">🧪 Open the Periodic Table</a></p>`;
  }
  app.innerHTML = `
  <section class="card">
    <div class="qhead">
      <span class="badge p${S.part}">Part ${S.part} · Question ${S.i+1} of 10</span>
      <button class="btn light" id="speak" type="button">🔊 Read aloud</button>
    </div>
    ${dotsHtml()}
    ${body}
    <div class="actions"><button class="btn ${S.part===1?'b1':'b2'}" id="check" type="button">Check answer ✔</button></div>
    <div id="fb" aria-live="polite"></div>
  </section>`;

  $('#check').addEventListener('click', check);
  $('#speak').addEventListener('click', () => {
    ac();
    speak(S.part === 1
      ? `${pn} decays into ${dn} and one missing particle. What is the missing particle?`
      : `${pn} undergoes ${d.name.toLowerCase()}. What is the daughter element?`);
  });
  app.querySelectorAll('[data-chip]').forEach(c => c.addEventListener('click', () => {
    const p = DECAY[c.dataset.chip].p;
    $('#fA').value = p.A; $('#fZ').value = p.pz; $('#fS').value = p.shown; sfx.click(); $('#check').focus();
  }));
  app.querySelectorAll('.slot input').forEach(i => i.addEventListener('input', () => i.classList.remove('good','bad')));
  $('#fA').focus({preventScroll:true});
}

function warn(msg){
  $('#fb').innerHTML = `<div class="fb warn" role="alert"><strong>✋ ${msg}</strong></div>`;
  const s = $('#slot'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
}

function arith(pv, dv){
  const dl = dv - pv;
  return dl === 0 ? `${pv} stays ${pv}` : `${pv} ${dl < 0 ? '−' : '+'} ${Math.abs(dl)} = ${dv}`;
}

function check(){
  if (S.answered) return;
  const q = S.qs[S.i], d = DECAY[q.type], P = q.parent, D = q.daughter;
  const A = num($('#fA').value), Z = num($('#fZ').value), raw = $('#fS').value, s = normS(raw);
  if (isNaN(A) || isNaN(Z) || !s) return warn('Fill in all three boxes with whole numbers and a symbol first.');
  ac();
  let okA, okZ, okS, fixHtml, explain;
  if (S.part === 1){
    const p = d.p;
    okA = A === p.A; okZ = Z === p.Z; okS = ALLOW[q.type].includes(s);
    fixHtml = `<span class="ans pcol" style="--c:var(${d.cv})">${nuc(p.A, p.pz, p.shown)}</span> <span>${p.label}</span>`;
    explain = q.type === 'g'
      ? `Mass number: ${P.A} − ${D.A} = <b>0</b>. Atomic number: ${P.Z} − ${D.Z} = <b>0</b>. Nothing changes except energy, so a <b>gamma ray</b> (⁰₀γ) is released: <b>${d.name}</b>.`
      : `Mass number: ${P.A} − ${D.A} = <b>${p.A}</b>. Atomic number: ${P.Z} − ${D.Z} = <b>${minus(p.Z)}</b>. A particle with A = ${p.A} and Z = ${minus(p.Z)} is ${PN[q.type]}, so this is <b>${d.name}</b>.`;
  } else {
    okA = A === D.A; okZ = Z === D.Z;
    okS = s === D.sym.toLowerCase() || s === D.name.toLowerCase() || ALT[s.replace(/-?\d+m?$/,'')] === D.Z ||
          s.replace(/-?\d+m?$/,'') === D.sym.toLowerCase() || s.replace(/-?\d+m?$/,'') === D.name.toLowerCase();
    fixHtml = `<span class="ans">${nuc(D.A, D.Z, D.sym)}</span> <span>${esc(nucName(D.sym, D.A))}</span>`;
    const rule = {'a':'A goes down by 4 and Z goes down by 2', 'b-':'A stays the same and Z goes up by 1', 'b+':'A stays the same and Z goes down by 1', 'g':'A and Z both stay the same'}[q.type];
    explain = `<b>${d.name}:</b> ${rule}. A: ${arith(P.A, D.A)}. Z: ${arith(P.Z, D.Z)}. Element ${D.Z} is <b>${D.name} (${D.sym})</b>, so the daughter is <b>${esc(nucName(D.sym, D.A))}</b>.`;
  }
  const fA = $('#fA'), fZ = $('#fZ'), fS = $('#fS');
  fA.classList.add(okA ? 'good':'bad'); fZ.classList.add(okZ ? 'good':'bad'); fS.classList.add(okS ? 'good':'bad');
  const ok = okA && okZ && okS;
  S.answered = true; S.res[S.i] = ok;
  if (ok) S.score++;
  updatePill();
  app.querySelectorAll('input, .chip, #check').forEach(el => el.disabled = true);
  $('.dots').outerHTML = dotsHtml();
  const last = S.i === 9;
  S.reviews[S.part-1].push({ok, q: S.part === 1
      ? `${nuc(P.A + (P.m?'m':''), P.Z, P.sym)} → ${nuc(D.A, D.Z, D.sym)} + ?`
      : `${nuc(P.A + (P.m?'m':''), P.Z, P.sym)} ${d.short} → ?`,
    a: fixHtml});
  if (ok){
    sfx.ok();
    $('#fb').innerHTML = `<div class="fb ok"><strong>✔ Correct! +1 point</strong><p>${explain}</p><button class="btn green" id="next" type="button">${last ? 'See my score 🏁' : 'Next question →'}</button></div>`;
  } else {
    sfx.bad();
    const wrong = [!okA && 'mass number', !okZ && 'atomic number', !okS && 'symbol'].filter(Boolean).join(', ');
    $('#fb').innerHTML = `<div class="fb no"><strong>✘ Not quite. Check your ${wrong}.</strong><p>The answer was: ${fixHtml}</p><p>${explain}</p><button class="btn green" id="next" type="button">${last ? 'See my score 🏁' : 'Next question →'}</button></div>`;
  }
  const nx = $('#next'); nx.addEventListener('click', next); nx.focus();
}

function next(){
  sfx.click();
  if (S.i < 9){ S.i++; renderQ(); } else partDone();
}

function medal(n){ return n === 10 ? '🥇' : n >= 8 ? '🥈' : n >= 6 ? '🥉' : '🎯'; }
function partMsg(n){
  return n === 10 ? 'Perfect score! You are a nuclear physicist in the making! ☢️🏆'
    : n >= 8 ? 'Fantastic work! Almost perfect!'
    : n >= 6 ? 'Good job! A little more practice and you will have it.'
    : n >= 4 ? 'Keep going! Review the quick guide and try again.'
    : 'Do not give up. Every scientist starts here!';
}
function reviewHtml(p){
  return `<ul class="review">${S.reviews[p-1].map((r,i) => `<li class="${r.ok?'ok':'no'}"><span class="mk">${r.ok?'✔':'✘'}</span><span>${i+1}.</span><span class="eq" style="font-size:1.5rem">${r.q}</span><span>→ ${r.a}</span></li>`).join('')}</ul>`;
}

function partDone(){
  const p = S.part; S.scores[p-1] = S.score; padWrap.hidden = true; updatePill();
  sfx.win(); if (S.score >= 8) confetti();
  const more = S.chain && p === 1;
  app.innerHTML = `
  <section class="card center">
    <span class="badge p${p}">Part ${p} complete</span>
    <div class="stars" aria-hidden="true">${medal(S.score)}</div>
    <div class="score-big" aria-label="Score ${S.score} out of 10">${S.score}<span style="font-size:.4em"> / 10</span></div>
    <p class="lead">${partMsg(S.score)}</p>
    ${reviewHtml(p)}
    <div class="actions" style="justify-content:center">
      ${more ? `<button class="btn b2 big" id="go" type="button">Start Part 2 →</button>` : `<button class="btn primary big" id="go" type="button">${S.scores[0]!==null && S.scores[1]!==null ? 'See total score 🏁' : 'Back to start'}</button>`}
      <button class="btn light" id="again" type="button">↻ Try Part ${p} again</button>
    </div>
  </section>`;
  $('#go').addEventListener('click', () => { sfx.click(); if (more) startPart(2, true); else if (S.scores[0]!==null && S.scores[1]!==null) finalScreen(); else home(); });
  $('#again').addEventListener('click', () => { sfx.click(); startPart(p, S.chain); });
  $('#go').focus();
}

function finalScreen(){
  const [a, b] = S.scores, tot = (a||0) + (b||0);
  const prev = parseInt(store.get('rdl-best') || '0', 10);
  if (a !== null && b !== null && tot > prev) store.set('rdl-best', String(tot));
  sfx.win(); if (tot >= 16) confetti();
  const date = new Date().toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
  app.innerHTML = `
  <section class="card center">
    <div class="stars" aria-hidden="true">${tot >= 18 ? '🏆' : tot >= 14 ? '🌟' : tot >= 10 ? '👍' : '🎯'}</div>
    <h2 style="font-size:1.8rem;margin:.2rem 0" tabindex="-1">${S.name ? esc(S.name) + ', your' : 'Your'} results</h2>
    <div class="totals">
      <div class="tot p1">Part 1 · Missing particle<b>${a === null ? '—' : a} / 10</b></div>
      <div class="tot p2">Part 2 · Daughter element<b>${b === null ? '—' : b} / 10</b></div>
      <div class="tot all">Total score<b>${tot} / 20</b></div>
    </div>
    <p class="lead">${partMsg(Math.round(tot / 2))}</p>
    <p class="sub">${date}</p>
    <div class="actions" style="justify-content:center">
      <button class="btn primary big" id="redo" type="button">↻ Play again (new questions)</button>
      <button class="btn light" id="print" type="button">🖨 Print results</button>
      <button class="btn light" id="home" type="button">Home</button>
    </div>
  </section>`;
  $('#redo').addEventListener('click', () => { sfx.click(); S.scores = [null,null]; startPart(1, true); });
  $('#print').addEventListener('click', () => window.print());
  $('#home').addEventListener('click', () => { sfx.click(); home(); });
  $('#redo').focus();
}

/* ---------- scratchpad (pen, touch, mouse) ---------- */
const padWrap = $('#padWrap'), pad = $('#pad'), pctx = pad.getContext('2d');
let pcol = '#1b1b3a', erase = false, drawing = false, last = null;
function fitPad(){
  const r = pad.getBoundingClientRect(); if (!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
}
function clearPad(){ pctx.clearRect(0, 0, pad.width, pad.height); }
function pt(e){ const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; }
function stroke(e){
  const dpr = window.devicePixelRatio || 1, p = pt(e);
  pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  pctx.strokeStyle = pcol;
  pctx.lineWidth = (erase ? 26 : (e.pointerType === 'pen' ? 1.5 + e.pressure * 5 : 3)) * dpr;
  pctx.beginPath(); pctx.moveTo(last[0], last[1]); pctx.lineTo(p[0] + .01, p[1]); pctx.stroke();
  last = p;
}
pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); drawing = true; last = pt(e); stroke(e); });
pad.addEventListener('pointermove', e => { if (drawing){ e.preventDefault(); stroke(e); } });
['pointerup','pointercancel'].forEach(t => pad.addEventListener(t, () => { drawing = false; }));
padWrap.addEventListener('toggle', () => { if (padWrap.open) fitPad(); });
$('#padClear').addEventListener('click', clearPad);
$('#padErase').addEventListener('click', e => { erase = !erase; e.currentTarget.setAttribute('aria-pressed', erase); });
padWrap.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
  pcol = b.dataset.c; erase = false; $('#padErase').setAttribute('aria-pressed', 'false');
  padWrap.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b));
}));

/* ---------- global ---------- */
$('#brand').addEventListener('click', () => { if (!S.part || confirm('Leave this activity and go back to the start? Your current progress in this part will be lost.')) home(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.tagName === 'INPUT' && t.closest('.slot')){ e.preventDefault(); if (S.answered){ const n = $('#next'); n && n.click(); } else check(); }
});

/* expose a tiny hook for automated testing */
window.__rdl = {POOL, DECAY, ZOF, SYM, NAMES, makeQ, buildSet, S};

home();
})();
</script>
